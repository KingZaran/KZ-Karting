<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Realms Kart</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:"Arial Black",Impact,system-ui,sans-serif;color:#fff}
canvas{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(#2b3a67,#0b0f1f);overflow:auto;padding:20px;box-sizing:border-box}
.screen.on{display:flex}
.screen.glass{background:linear-gradient(180deg,rgba(5,8,20,.72),rgba(5,8,20,.12) 42%,rgba(5,8,20,.78))}
h1{font-size:44px;margin:0;letter-spacing:2px} h2{margin:0}
select,button{font-family:inherit;font-size:17px;padding:8px 14px;border-radius:8px;border:0}
button{background:#ffcc00;font-weight:700;cursor:pointer}
button.sec{background:#3a4a7a;color:#fff;font-size:13px;padding:6px 12px}
/* title */
.logo{font-size:min(14vw,150px);font-weight:900;font-style:italic;letter-spacing:-2px;line-height:1;transform:rotate(-4deg) skewX(-8deg);background:linear-gradient(180deg,#fff7a8 10%,#ffc400 45%,#ff6a00 90%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:5px #1a0a00;paint-order:stroke fill;filter:drop-shadow(0 8px 0 #c1121f) drop-shadow(0 18px 24px #000)}
.logo i{font-style:normal;color:#e60012;-webkit-text-fill-color:#e60012}
.logo.small{font-size:min(9vw,84px);margin-bottom:24px}
.press{font-size:26px;letter-spacing:6px;animation:blink 1.1s infinite;text-shadow:0 3px 8px #000;margin-top:34px}
@keyframes blink{50%{opacity:.25}}
.credit{position:absolute;bottom:14px;font-size:12px;opacity:.6;letter-spacing:2px}
/* main menu */
.stack{display:flex;flex-direction:column;gap:18px;width:min(520px,90vw)}
.big-btn{font-size:30px;font-style:italic;padding:22px 30px;border-radius:60px;background:linear-gradient(180deg,#fff,#d9dde8);color:#1a1f33;border:5px solid #1a1f33;box-shadow:0 8px 0 #0008;transition:transform .12s;text-transform:uppercase;letter-spacing:1px}
.big-btn.sel{background:linear-gradient(180deg,#ff5a5a,#e60012);color:#fff;transform:scale(1.07) translateX(8px);border-color:#fff;box-shadow:0 10px 0 #7a0010,0 0 30px #e6001288}
.big-btn.dim{opacity:.75}
.big-btn.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.hint{font-size:13px;opacity:.7;letter-spacing:2px;margin-top:20px}
/* setup */
.wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;width:min(1240px,97vw);height:min(88vh,780px)}
.panel{background:rgba(8,12,30,.82);border:4px solid #ffffff30;border-radius:26px;padding:16px 22px;overflow:auto;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:8px}
.ptitle{font-size:20px;letter-spacing:3px;font-style:italic;color:#ffd400;margin-bottom:6px;text-shadow:0 2px 0 #000}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 20px;border-radius:40px;background:#ffffff16;font-size:16px;cursor:pointer;border:3px solid transparent;transition:transform .1s}
.row.sel{background:linear-gradient(90deg,#e60012,#ff5a5a);transform:scale(1.025);border-color:#fff;box-shadow:0 0 22px #e6001266}
.row .val{display:flex;align-items:center;gap:14px}.row em{font-style:normal;min-width:130px;text-align:center}
.ar{cursor:pointer;opacity:.85;padding:0 6px}.ar:hover{transform:scale(1.35)}
#itemsHead{border-radius:16px}#itemsHead .mini{display:flex;gap:6px}
#items{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tile{position:relative;background:#ffffff14;border:3px solid transparent;border-radius:14px;padding:4px 2px 3px;text-align:center;cursor:pointer;font-size:9px;line-height:1.1;transition:transform .1s,opacity .15s,filter .15s}
.tile img{width:100%;max-width:42px;display:block;margin:0 auto 3px;image-rendering:auto}
.tile.off{opacity:.3;filter:grayscale(1)}
.tile.cur{border-color:#fff;transform:scale(1.1);background:#ffffff30;z-index:2}
.tile:hover{transform:scale(1.07)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.foot small{font-size:10px;opacity:.6;max-width:55%;line-height:1.4;letter-spacing:.5px}
button.go{font-size:24px;font-style:italic;padding:12px 34px;border-radius:50px;background:linear-gradient(180deg,#fff,#d9dde8);color:#1a1f33;border:4px solid #1a1f33}
button.go.sel{background:linear-gradient(180deg,#ff5a5a,#e60012);color:#fff;border-color:#fff;transform:scale(1.08)}
.soon{margin:auto;text-align:center;opacity:.55;font-size:16px;letter-spacing:2px;line-height:1.8}
#gview{position:relative;height:min(250px,32vh);border-radius:18px;background:radial-gradient(circle at 50% 70%,#3a4a7a,#0e1226);overflow:hidden;flex:none}
#gcanvas{width:100%;height:100%;display:block}
#gname{position:absolute;bottom:8px;left:14px;font-size:22px;font-style:italic;text-shadow:0 2px 6px #000}
#gname small{display:block;font-size:10px;letter-spacing:3px;color:#ffd400;font-style:normal}
.row.s{padding:6px 18px;font-size:15px}.row.s em{min-width:150px;display:flex;align-items:center;justify-content:center;gap:8px}
.sw{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}
#gstats{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.stat{display:grid;grid-template-columns:104px 1fr 22px;gap:10px;align-items:center;font-size:12px}
.bar{height:12px;background:#ffffff1c;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#33d17a,#ffd400 60%,#ff5a5a);border-radius:8px;transition:width .2s}
.dimp{opacity:.62;transition:opacity .15s}
/* vote */
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:900px}
.card{width:190px;background:#1a2347;border:3px solid transparent;border-radius:12px;padding:10px;cursor:pointer;text-align:center;position:relative}
.card:hover{border-color:#ffcc0088}.card.sel{border-color:#ffcc00}.card.win{border-color:#4cff7a;box-shadow:0 0 20px #4cff7a}
.card canvas{width:100%;border-radius:8px}
.badge{position:absolute;top:6px;right:6px;background:#e53935;border-radius:12px;padding:2px 9px;font-weight:700}
#hud{position:fixed;top:12px;left:16px;font-size:26px;font-weight:700;text-shadow:0 2px 4px #000;display:none;line-height:1.3}
#itemBox{position:fixed;top:12px;left:50%;transform:translateX(-50%);min-width:110px;height:84px;background:#0009;border:3px solid #fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;line-height:1}
#itemBox img{width:52px;height:52px}
#itemBox small{font-size:13px;margin-top:4px}
#ink{position:fixed;inset:0;background:radial-gradient(circle,#0000 5%,#111 70%);opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#zone{position:fixed;top:120px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:800;text-shadow:0 3px 8px #000;opacity:0;pointer-events:none;letter-spacing:2px;white-space:nowrap}
#zone.show{animation:zn 3s ease-out}
@keyframes zn{0%{opacity:0;transform:translate(-50%,-10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#mini{position:fixed;right:14px;bottom:14px;width:160px;height:160px;background:#0007;border:2px solid #fff6;border-radius:12px;display:none;pointer-events:none}
#menuBtn{position:fixed;top:12px;right:16px;display:none}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:900;text-shadow:0 4px 10px #000;pointer-events:none;text-align:center}
#ink{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at 30% 40%,#000 0,#000c 28%,transparent 45%),radial-gradient(ellipse at 70% 60%,#000 0,#000c 30%,transparent 48%),radial-gradient(ellipse at 50% 20%,#000d 0,transparent 35%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;transition:opacity .25s}
#help{position:fixed;bottom:10px;left:16px;font-size:13px;opacity:.7;display:none}
</style></head><body>
<div id="title" class="screen glass on"><div class="logo"><span>KZ</span><i>-</i>KARTING</div><div class="press">PRESS ENTER</div><div class="credit">KZ-KARTING · FRIENDS EDITION</div></div>

<div id="main" class="screen glass"><div class="logo small"><span>KZ</span><i>-</i>KARTING</div>
 <div class="stack"><button class="big-btn sel">Single Player</button><button class="big-btn">Online Multiplayer</button></div>
 <div class="hint">↑ ↓ CHOOSE · ENTER CONFIRM · ESC BACK</div></div>

<div id="menu" class="screen glass"><div class="wrap">
 <div class="panel" id="leftPanel"><div class="ptitle">SINGLE PLAYER · RACE SETUP</div>
  <div id="rows"></div>
  <div class="row" id="itemsHead" style="cursor:default"><span>Items</span><span class="mini"><button class="sec" id="iAll">All on</button><button class="sec" id="iNone">All off</button><button class="sec" id="iRand">Random</button></span></div>
  <div id="items"></div>
  <div class="foot"><button class="sec" id="backBtn">◀ BACK</button><small>WASD / ARROWS DRIVE · SPACE DRIFT · E / ENTER ITEM (HOLD S TO DROP BEHIND) · R RESTART · M MUTE</small><button class="go" id="start">OK ▶</button></div>
 </div>
 <div class="panel" id="garage"><div class="ptitle">GARAGE <small style="opacity:.55;font-size:11px;letter-spacing:2px;margin-left:8px">TAB = SWITCH PANEL</small></div><div id="gview"><canvas id="gcanvas"></canvas><div id="gname"></div></div><div id="grows"></div><div id="gstats"></div></div></div>
 </div>
 <div style="display:none">
  <select id="bots"></select>
  <select id="diff"><option value="0.8">Easy</option><option value="0.9" selected>Normal</option><option value="1">Hard</option></select>
  <select id="laps"><option>1</option><option>2</option><option>3</option><option>5</option><option>7</option></select>
  <select id="cls"><option value="0.8">50cc</option><option value="1" selected>100cc</option><option value="1.2">150cc</option><option value="1.4">200cc</option></select>
  <select id="gfx"><option value="high" selected>High</option><option value="low">Low (faster)</option></select>
 </div>
</div>

<div id="vote" class="screen"><h1>VOTE FOR A TRACK</h1><h2 id="voteMsg"></h2><div class="cards" id="cards"></div></div>

<button id="menuBtn" class="sec">☰ Menu</button>
<div id="hud"><div id="hudText"></div><div id="itemBox"></div></div><div id="ink"></div><div id="flash"></div><canvas id="mini" width="160" height="160"></canvas><div id="zone"></div><div id="big"></div><div id="help"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="js/main.js"></script>
</body></html>
