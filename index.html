<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Realms Kart</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(#2b3a67,#0b0f1f)}
#menu h1{font-size:48px;margin:0;letter-spacing:2px}
#menu label{display:flex;gap:10px;align-items:center}
select,button{font-size:18px;padding:8px 14px;border-radius:8px;border:0}
button{background:#ffcc00;font-weight:700;cursor:pointer}
#hud{position:fixed;top:12px;left:16px;font-size:26px;font-weight:700;text-shadow:0 2px 4px #000;display:none;line-height:1.3}
#big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;text-shadow:0 4px 10px #000;pointer-events:none}
#help{position:fixed;bottom:10px;left:16px;font-size:13px;opacity:.7;display:none}
</style></head><body>
<div id="menu"><h1>TURBO REALMS KART</h1>
<label>Bots <select id="bots"></select></label>
<label>Laps <select id="laps"><option>1</option><option selected>3</option><option>5</option></select></label>
<button id="start">START RACE</button>
<small>W/A/S/D or arrows to drive · Space/Shift to drift (release for a boost)</small></div>
<div id="hud"></div><div id="big"></div><div id="help">R = restart</div>
<script type="module" src="js/main.js"></script>
</body></html>
